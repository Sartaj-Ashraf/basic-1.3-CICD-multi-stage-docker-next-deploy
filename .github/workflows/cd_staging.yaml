name: Deploy dockerized Next.js app to staging
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: sartajashraf/basic-1.3-cicd-multi-stage-docker-next-deploy
  CONTEXT: frontend
  DOCKERFILE: ./docker/Dockerfile.frontend
  CONTAINER_NAME: basic-1.3-cicd-multi-stage
  APP_PORT: 3030

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: SSH to the server and deploy
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          CONTAINER: ${{ env.CONTAINER_NAME }}
          PORT: ${{ env.APP_PORT }}
        with:
          host: ${{ secrets.SSH_HOST_IP }}
          username: ${{ secrets.SSH_HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,CONTAINER,PORT
          script: |
            set -euo pipefail

            echo "Deploying image: $IMAGE on port $PORT"

            docker pull "$IMAGE"

            OLD_CONTAINER="${CONTAINER}-old"
            NEW_CONTAINER="${CONTAINER}-new"

            # Clean up any stale containers from a previous failed run
            docker rm -f "$NEW_CONTAINER" 2>/dev/null || true
            docker rm -f "$OLD_CONTAINER" 2>/dev/null || true

            echo "Starting new container alongside the old one..."
            docker run -d \
              --name "$NEW_CONTAINER" \
              --restart unless-stopped \
              -e PORT="$PORT" \
              -p "127.0.0.1:$((PORT+1)):$PORT" \
              "$IMAGE"

            echo "Waiting for health check..."
            HEALTHY=false
            for i in $(seq 1 10); do
              if curl -sf "http://127.0.0.1:$((PORT+1))/" >/dev/null; then
                HEALTHY=true
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "New container failed health check. Rolling back."
              docker logs "$NEW_CONTAINER" --tail 50 || true
              docker rm -f "$NEW_CONTAINER"
              exit 1
            fi

            echo "Health check passed. Cutting over..."
            docker rm -f "$NEW_CONTAINER"

            if docker ps -q -f name="^${CONTAINER}$" | grep -q .; then
              docker rename "$CONTAINER" "$OLD_CONTAINER"
              docker stop "$OLD_CONTAINER" || true
            fi

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -e PORT="$PORT" \
              -p "$PORT:$PORT" \
              "$IMAGE"

            docker rm -f "$OLD_CONTAINER" 2>/dev/null || true

            echo "Pruning dangling images..."
            docker image prune -f

            echo "Deployment completed successfully."